<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Compteur de Ticket</title>
<meta name="description" content="Suivi des installations FTTH de KBOWD Group">
<meta name="theme-color" content="#0B0714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compteur Ticket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  // Thème choisi (sombre par défaut), appliqué avant l'affichage pour éviter un flash.
  try { var t = localStorage.getItem("mct:theme") || "dark"; if (t !== "auto") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); } catch (e) {}
</script>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<div id="splash" class="splash">
  <img src="logo.jpg" alt="" class="splash-logo">
  <div class="splash-name">Mon Compteur de Ticket</div>
  <div class="splash-bar"><i></i></div>
</div>

<div id="auth" hidden></div>

<div id="shell" hidden>
  <header class="top">
    <div class="top-in">
      <img class="logo" alt="KBOWD Group" src="logo.jpg">
      <div class="brand">
        <h1>Mon Compteur de Ticket</h1>
        <p id="subtitle"></p>
      </div>
      <span class="sync" id="sync"><i></i><span>En ligne</span></span>
      <button class="avatar" id="avatarBtn" type="button" data-tab="menu" aria-label="Menu et réglages"></button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="dock" aria-label="Navigation principale">
    <button class="dock-btn" data-tab="home" type="button"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
    <button class="dock-btn" data-tab="tickets" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10h8M8 14h5"/></svg><span>Tickets</span></button>
    <button class="dock-add" data-act="new-ticket" type="button" aria-label="Nouveau ticket"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="dock-btn" data-tab="dash" type="button"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span>Tableau</span></button>
    <button class="dock-btn" data-tab="zones" type="button"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Zones</span></button>
  </nav>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
